# Basic checks, no secrets, no game data, no GPU. Every command is also runnable locally (CONTRIBUTING.md, "CI").
# This is a fork of an upstream project: formatting is checked only on the lines a change touches (src/.clang-format).
# The GPU back end is not built here: it needs 14 submodules (SDL3, SPIRV-Tools, ffmpeg-core, ...) and a Vulkan stack, and a
# cold build does not fit a basic check. Build it locally (README.md, "Build and test") and paste the result into the PR.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Actions are pinned to a full commit SHA (the comment names the release); Dependabot (github-actions) raises them.
jobs:
  clang-format:
    name: clang-format (changed lines only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - run: for i in 1 2 3; do pip install clang-format==22.1.3 && break; [ $i = 3 ] && exit 1; sleep $((i*10)); done
      - name: Commits of the change (pull request) or of the push
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: .github/nps5-ci/range.sh >> "$GITHUB_ENV"
      - name: git clang-format against the base
        run: |
          if [ -z "$BASE" ]; then echo "no base commit (first push, new branch or manual run): nothing to compare, skipped"; exit 0; fi
          out=$(git clang-format --diff --extensions cpp,h,inc "$BASE" "$TIP" -- src || true)
          case "$out" in *"no modified files"*|*"did not modify any files"*|"") echo "clang-format: ok" ;;
            *) echo "$out"; echo "::error::run: git clang-format $BASE   (formats only the lines you changed)"; exit 1 ;; esac

  privacy:
    name: privacy and identity gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Commits of the change (pull request) or of the push
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: .github/nps5-ci/range.sh >> "$GITHUB_ENV"
      - name: Game data, secrets, personal paths, commit e-mails and added lines (copy of the entry repository's gate, .github/nps5-ci)
        run: .github/nps5-ci/privacy.sh

  unit-tests-arm64:
    name: header-only unit tests (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: Build and run the stand-alone header-only tests (no submodules, no GPU)
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/ut"
          for t in CpLeadBound PredicationDrain FaultClass ReplaySkipStats MeshIndirectStats; do
            clang++ -std=c++20 -O2 -Isrc "tests/${t}Tests.cpp" -o "$RUNNER_TEMP/ut/$t"
            "$RUNNER_TEMP/ut/$t"
          done
          clang++ -std=c++20 -O1 -Isrc tests/SarosProgramCacheTests.cpp -o "$RUNNER_TEMP/ut/SarosProgramCache"
          for m in off default cache; do "$RUNNER_TEMP/ut/SarosProgramCache" "$m"; done
          clang++ -std=c++20 -O1 -Isrc tests/HtilePrefixRebindTests.cpp -o "$RUNNER_TEMP/ut/HtilePrefixRebind"
          "$RUNNER_TEMP/ut/HtilePrefixRebind"
          "$RUNNER_TEMP/ut/HtilePrefixRebind" on
          clang++ -std=c++17 -O1 -Isrc/graphics/presentation tests/AutoCapTests.cpp -o "$RUNNER_TEMP/ut/AutoCap"
          "$RUNNER_TEMP/ut/AutoCap"

  workflows:
    name: workflow syntax (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: actionlint 1.7.7 (release tarball, sha256 checked)
        run: |
          curl --retry 3 --retry-delay 5 --retry-all-errors -fsSL -o "$RUNNER_TEMP/actionlint.tgz" https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
